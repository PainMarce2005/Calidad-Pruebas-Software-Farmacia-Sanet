name: farmacia-qa

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - type: bind
        source: ./database/Base - Datos.sql
        target: /schema/Base - Datos.sql
        read_only: true
      - type: bind
        source: ./database/init/01-import-schema.sh
        target: /docker-entrypoint-initdb.d/01-import-schema.sh
        read_only: true
      - type: bind
        source: ./database/init/02-qa-compat.sql
        target: /docker-entrypoint-initdb.d/02-qa-compat.sql
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend/comprobantes:/app/comprobantes
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  k6:
    image: grafana/k6:2.4.0
    profiles:
      - performance
    command:
      - run
      - /scripts/performance.js
    environment:
      API_URL: http://backend:3001
      TEST_ADMIN_EMAIL: ${TEST_ADMIN_EMAIL:-admin@farmacia.com}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-Admin123!}
    volumes:
      - type: bind
        source: ./6. Rendimiento (tiempos de respuesta, throughput)/performance.js
        target: /scripts/performance.js
        read_only: true
      - type: bind
        source: ./6. Rendimiento (tiempos de respuesta, throughput)/reports
        target: /workspace/6. Rendimiento (tiempos de respuesta, throughput)/reports
    working_dir: /workspace
    depends_on:
      backend:
        condition: service_healthy

  k6-stress:
    image: grafana/k6:2.4.0
    profiles:
      - performance
    command:
      - run
      - /scripts/stress.js
    environment:
      API_URL: http://backend:3001
      TEST_ADMIN_EMAIL: ${TEST_ADMIN_EMAIL:-admin@farmacia.com}
      TEST_ADMIN_PASSWORD: ${TEST_ADMIN_PASSWORD:-Admin123!}
    volumes:
      - type: bind
        source: ./6. Rendimiento (tiempos de respuesta, throughput)/stress.js
        target: /scripts/stress.js
        read_only: true
      - type: bind
        source: ./6. Rendimiento (tiempos de respuesta, throughput)/reports
        target: /workspace/6. Rendimiento (tiempos de respuesta, throughput)/reports
    working_dir: /workspace
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
